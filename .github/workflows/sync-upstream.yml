name: Sync from upstream

on:
  schedule:  # run 90 mins after the upstream library update
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency: sync-upstream

env:
  UPSTREAM_REPO: https://github.com/CDFER/JLCPCB-Kicad-Library.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: cordicor

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        env:
          GIT_LITERAL_PATHSPECS: 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          upstream="upstream/$UPSTREAM_BRANCH"
          echo "UPSTREAM_SHA=$(git rev-parse --short "$upstream")" >> "$GITHUB_ENV"

          if ! git merge --no-ff --no-commit -X theirs "$upstream"; then
              git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' file; do
                  if git cat-file -e "$upstream:$file" 2>/dev/null; then
                      git checkout "$upstream" -- "$file"
                  else
                      git rm -q -f -- "$file"
                  fi
              done
          fi

          # Keep the cordicor price-parser fix; -X theirs would overwrite it.
          git checkout HEAD -- libraryCreatorScript.py
          git rm -q -f --ignore-unmatch .github/workflows/update-library.yml

      - name: Seed symbol libraries from last full package
        run: |
          set -euo pipefail
          zip="$(mktemp)"
          tmp="$(mktemp -d)"
          url="https://github.com/CDFER/JLCPCB-Kicad-Library/releases/download/2025.07.18/JLCPCB-KiCad-Library-2025.07.18.zip"
          curl -fL --retry 3 -o "$zip" "$url"
          unzip -q "$zip" -d "$tmp"
          src="$(find "$tmp" -type d -name symbols -print -quit)"
          [ -n "$src" ]
          find "$src" -name '*.kicad_sym' -exec cp -f {} symbols/ \;
          if ! grep -q '(symbol ' symbols/JLCPCB-Resistors.kicad_sym; then
            echo "::error::2025.07.18 package has no resistor symbols"
            exit 1
          fi
          rm -rf "$zip" "$tmp"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate symbol libraries
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python libraryCreatorScript.py
          # The generator archives footprints and STEP files because their paths
          # already point at ${KIPRJMOD}. Keep only the generated symbols.
          git checkout -- 3dmodels footprints Archived-Symbols-Footprints
          if ! grep -q '(symbol ' symbols/JLCPCB-Diodes.kicad_sym; then
            echo "::error::libraryCreatorScript.py did not write symbols"
            exit 1
          fi
          rm -f JLCPCB-KiCad-Library-*.zip leftover.csv jlcpcb-components-basic-preferred.csv

      - name: Rewrite 3D-model paths
        run: |
          bash fix_3d_model_paths.sh
          if grep -rq '_3RD_PARTY}' footprints; then
              echo "::error::footprints still reference the KiCad 3rd party folder"
              exit 1
          fi

      - name: Commit and push
        run: |
          git add -A
          if git rev-parse -q --verify MERGE_HEAD > /dev/null || ! git diff --cached --quiet; then
              git commit -m "Sync upstream $UPSTREAM_SHA and rewrite 3D-model paths"
              git push origin "HEAD:$TARGET_BRANCH"
          else
              echo "Already up to date"
          fi