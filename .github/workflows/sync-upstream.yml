name: Sync from upstream

on:
  schedule:  # run 90 mins after the upstream library update
    - cron: "30 7 * * *"
  workflow_dispatch:  # allow for manually trigger workflow

concurrency: sync-upstream

env:
  UPSTREAM_REPO: https://github.com/CDFER/JLCPCB-Kicad-Library.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: cordicor

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # merged and changed files to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0  # full history is needed to merge
          # The default token is not allowed to push changes to workflow files.
          # Set the SYNC_TOKEN secret (PAT with contents + workflows write) if
          # upstream changes its workflows and the push gets rejected.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        env:
          GIT_LITERAL_PATHSPECS: 1  # footprint file names contain spaces and commas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          upstream="upstream/$UPSTREAM_BRANCH"
          echo "UPSTREAM_SHA=$(git rev-parse --short "$upstream")" >> "$GITHUB_ENV"

          # Upstream wins on conflicts, the path rewrite is re-applied afterwards
          if ! git merge --no-ff --no-commit -X theirs "$upstream"; then
              # Left over are conflicts like modify/delete: take the upstream state
              git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' file; do
                  if git cat-file -e "$upstream:$file" 2>/dev/null; then
                      git checkout "$upstream" -- "$file"
                  else
                      git rm -q -f -- "$file"
                  fi
              done
          fi

          # The upstream library generator must not run in this fork
          git rm -q -f --ignore-unmatch .github/workflows/update-library.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Patch price parser
        run: |
          python - << 'PY'
          from pathlib import Path
          path = Path("libraryCreatorScript.py")
          lines = path.read_text().splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if "price_json = json.loads(df.loc[index, \"price\"])" in line)
          start -= 1  # the try:
          end = next(i for i in range(start, len(lines)) if "Price cannot be parsed" in lines[i])
          if not lines[start].lstrip().startswith("try:"):
              raise SystemExit(f"expected try at line {start + 1}: {lines[start]!r}")
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          inner = indent + "    "
          lines[start:end + 1] = [
              f"{indent}price = None\n",
              f"{indent}try:\n",
              f"{inner}raw_price = str(df.loc[index, \"price\"])\n",
              f"{inner}if raw_price.startswith(\"[\") :\n",
              f"{inner}    price_json = json.loads(raw_price)\n",
              f"{inner}    base_price = float(price_json[0][\"price\"])\n",
              f"{inner}else:\n",
              f"{inner}    base_price = float(raw_price.split(\",\")[0].split(\":\")[-1])\n",
              f"{inner}price = round(base_price + (joints * joint_cost), 3)\n",
              f"{inner}price_str = f\"{{price:.3f}}USD\"\n",
              f"{indent}except (json.JSONDecodeError, ValueError, KeyError, TypeError, IndexError):\n",
              f"{inner}price_str = \"\"\n",
              f"{inner}print(f\"Error: Price cannot be parsed https://jlcpcb.com/partdetail/C{{lcsc}}\")\n",
          ]
          text = "".join(lines)
          text = text.replace(
              "if price > 3.0 or footprint_name == \"0201\"",
              "if price is None or price > 3.0 or footprint_name == \"0201\"",
              1,
          )
          path.write_text(text)
          print("patched price parser")
          PY

      - name: Generate symbol libraries
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python libraryCreatorScript.py
          if ! grep -q '(symbol ' symbols/JLCPCB-Resistors.kicad_sym; then
            echo "::error::libraryCreatorScript.py did not write symbols"
            exit 1
          fi
          rm -f JLCPCB-KiCad-Library-*.zip leftover.csv jlcpcb-components-basic-preferred.csv

      - name: Rewrite 3D-model paths
        run: |
          bash fix_3d_model_paths.sh
          if grep -rq '_3RD_PARTY}' footprints; then
              echo "::error::footprints still reference the KiCad 3rd party folder"
              exit 1
          fi

      - name: Commit and push
        run: |
          git add -A
          if git rev-parse -q --verify MERGE_HEAD > /dev/null || ! git diff --cached --quiet; then
              git commit -m "Sync upstream $UPSTREAM_SHA and rewrite 3D-model paths"
              git push origin "HEAD:$TARGET_BRANCH"
          else
              echo "Already up to date"
          fi